name: EP-001 Model Replay Qualification

on:
  push:
    branches:
      - 'candidate/mtel-ep-001-provenance-independence-20261026'
    paths:
      - 'benchmark/harness/candidates/ep001/model_replay_qualification.py'
      - '.github/workflows/ep001-model-replay.yml'
      - 'benchmark/harness/candidates/ep001/candidate.json'
  pull_request:
    paths:
      - 'benchmark/harness/candidates/ep001/model_replay_qualification.py'
      - '.github/workflows/ep001-model-replay.yml'
      - 'benchmark/harness/candidates/ep001/candidate.json'

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh
      - name: Start Ollama
        run: |
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/ollama.log
          exit 1
      - name: Pull replay models
        run: |
          ollama pull qwen2.5:0.5b
          ollama pull qwen2.5:1.5b
          ollama pull qwen2.5:7b
      - name: Run EP-001 repeated replay and stronger-model sentinel
        run: |
          python benchmark/harness/candidates/ep001/model_replay_qualification.py \
            --out benchmark/harness/candidates/ep001/model_replay_results.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ep001-model-replay-results
          path: |
            benchmark/harness/candidates/ep001/model_replay_results.jsonl
            /tmp/ollama.log
          if-no-files-found: warn
